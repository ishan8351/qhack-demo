# QuantumBank Edge Gateway TLS Configuration
# Trap: Commented out legacy ciphers
# ssl_ciphers 'RC4-MD5:DES-CBC3-SHA';

server {
    listen 443 ssl http2;
    server_name api.quantumbank.com;

    ssl_certificate /etc/ssl/certs/server.crt;
    ssl_certificate_key /etc/ssl/certs/server.key;

    # Asset 24: Classical RSA & ECDHE TLS cipher suites
    ssl_ciphers 'ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384';
    
    # Asset 25: TLS protocols
    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
}
